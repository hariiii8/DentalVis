<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="100%" height="100%">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164B50" />
      <stop offset="35%" stop-color="#247F83" />
      <stop offset="70%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#A4E6D5" />
    </linearGradient>
    <linearGradient id="visGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247F83" />
      <stop offset="60%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#A4E6D5" />
    </linearGradient>
    <filter id="fullLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#247F83" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(40, 20) scale(0.43)" filter="url(#fullLogoGlow)">
    <!-- Upper Tooth Cap Segment -->
    <path d="M 170 260 
             C 120 230, 95 180, 130 130 
             C 170 80, 260 100, 300 160 
             C 340 100, 430 80, 470 130 
             C 505 180, 480 230, 430 260 
             C 390 220, 350 200, 300 200 
             C 250 200, 210 220, 170 260 Z" 
          fill="url(#markGrad)" />

    <!-- Central Pupil/Iris Disc -->
    <circle cx="300" cy="270" r="54" fill="url(#markGrad)" />
    <circle cx="285" cy="255" r="14" fill="#FFFFFF" fill-opacity="0.35" />

    <!-- Lower Tooth Roots Segment -->
    <path d="M 160 280 
             C 200 320, 245 340, 300 340 
             C 355 340, 400 320, 440 280 
             C 455 340, 440 430, 400 480 
             C 370 515, 335 480, 320 440 
             C 310 405, 290 405, 280 440 
             C 265 480, 230 515, 200 480 
             C 160 430, 145 340, 160 280 Z" 
          fill="url(#markGrad)" />
  </g>

  <!-- Wordmark "DentalVis" -->
  <text x="320" y="195" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="140" font-weight="800" letter-spacing="-3">
    <tspan fill="#164B50">Dental</tspan><tspan fill="url(#visGrad)">Vis</tspan>
  </text>
</svg>
