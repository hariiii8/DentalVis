<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="24" />
  <!-- Joint Articulation Motion Arcs -->
  <path d="M 330 200 A 70 70 0 0 1 470 200" fill="none" stroke="#20B2AA" stroke-width="2.5" stroke-dasharray="4 4" />
  <g filter="url(#shadow)">
    <!-- Mandibular Condyle & Articular Fossa Anatomy -->
    <path d="M 340 140 C 370 120, 430 120, 460 140 L 480 160 C 450 170, 350 170, 320 160 Z" fill="#94A3B8" stroke="#475569" stroke-width="2.5" />
    <!-- Articular Disc (Fibrocartilage Cushion) -->
    <ellipse cx="400" cy="180" rx="60" ry="14" fill="#20B2AA" stroke="#0D9488" stroke-width="2" />
    <!-- Mandibular Condyle Head -->
    <path d="M 350 210 C 350 190, 450 190, 450 210 C 450 260, 430 330, 400 350 C 370 330, 350 260, 350 210 Z" fill="#FFFFFF" stroke="#0D9488" stroke-width="4" />
  </g>
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">TMJD • TMJ &amp; Orofacial Pain</text>
</svg>
