  </g>
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#20B2AA" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">SLPA • Sleep &amp; Airway Dental Care</text>
