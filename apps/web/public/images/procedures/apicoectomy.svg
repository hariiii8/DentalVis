<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAF9" />
      <stop offset="50%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <filter id="dropApi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E11D48" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgApi)" rx="24" />

  <!-- Single Rooted Anterior / Premolar Tooth With Resected Apex and Retro-Fill -->
  <g filter="url(#dropApi)">
    <!-- Natural Tooth Body -->
    <path d="M 350 180 
             C 350 120, 380 110, 400 110 
             C 420 110, 450 120, 450 180 
             L 440 320 
             L 360 320 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" />

    <!-- Root Canal with Conventional Gutta-Percha -->
    <path d="M 400 180 L 400 300" stroke="#F87171" stroke-width="6" stroke-linecap="round" />

    <!-- Resected Apex Cut Surface (Horizontal Bevel at 320px) -->
    <line x1="355" y1="320" x2="445" y2="320" stroke="#E11D48" stroke-width="3" stroke-dasharray="4 2" />

    <!-- Retrograde Bioceramic (MTA) Root-End Seal Plug (3mm depth) -->
    <rect x="395" y="300" width="10" height="20" rx="2" fill="#10B981" stroke="#047857" stroke-width="2" />

    <!-- Bone Resorption Crypt & Microsurgical Curettage Area -->
    <circle cx="400" cy="335" r="32" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3" />
  </g>

  <!-- Microsurgical Cut Line Callout -->
  <rect x="120" y="305" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" />
  <text x="210" y="326" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9F1239" text-anchor="middle">3mm Root-End Resection</text>
  <line x1="300" y1="321" x2="355" y2="320" stroke="#E11D48" stroke-width="1.5" />

  <rect x="495" y="305" width="185" height="32" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
  <text x="587" y="326" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Retrograde Bioceramic Seal</text>
  <line x1="495" y1="321" x2="410" y2="310" stroke="#059669" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">ENDO-API-01 • Endodontics</text>
</svg>