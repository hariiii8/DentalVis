<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="extBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="elevatorSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#extBg)" rx="24" />

  <!-- Vertical Elevation Directional Vector -->
  <path d="M 400 130 L 400 70" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
  <polyline points="388,85 400,68 412,85" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Alveolar Bone Architecture & Tooth Socket -->
  <g filter="url(#shadow)">
    <!-- Alveolar Ridge Bone (Cutaway Cross-Section) -->
    <path d="M 240 290 Q 400 270 560 290 L 560 410 L 240 410 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5" />
    
    <!-- Empty Conical Alveolar Socket Contour (Socket Outline) -->
    <path d="M 360 280 C 370 340, 385 375, 400 375 C 415 375, 430 340, 440 280 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Intact Tooth Being Gently Elevated from Socket -->
    <!-- Positioned elevated +30px above socket base -->
    <g transform="translate(0, -35)">
      <!-- Single-Root Premolar / Anterior Anatomical Profile -->
      <path d="M 360 220 
               C 355 160, 375 140, 400 140 
               C 425 140, 445 160, 440 220 
               C 435 270, 420 320, 405 345 
               C 400 350, 400 350, 395 345 
               C 380 320, 365 270, 360 220 Z" 
            fill="#FFFFFF" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" />

      <!-- Natural Root Periodontal Ligament Line -->
      <path d="M 370 230 C 375 270, 390 320, 400 330 C 410 320, 425 270, 430 230" fill="none" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <!-- Dental Luxating Elevator Micro-Instrument (Engaging Alveolar Crest) -->
    <path d="M 280 220 L 365 245 L 360 260 L 275 235 Z" fill="url(#elevatorSteel)" stroke="#334155" stroke-width="2" stroke-linejoin="round" />
    <!-- Instrument Handle Extension -->
    <path d="M 200 190 L 285 225 L 275 245 L 190 210 Z" fill="#64748B" stroke="#1E293B" stroke-width="2" />
  </g>

  <!-- Technical Callouts -->
  <rect x="140" y="110" width="160" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="220" y="131" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Gentle Axial Elevation</text>
  <line x1="300" y1="126" x2="385" y2="85" stroke="#0D9488" stroke-width="1.5" />

  <rect x="500" y="310" width="165" height="32" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
  <text x="582" y="331" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Preserved Bone Socket</text>
  <line x1="500" y1="326" x2="435" y2="326" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="235" y="440" width="330" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">OMFS-EXT-01 • Oral &amp; Maxillofacial Surgery</text>
</svg>
