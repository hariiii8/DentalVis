<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAF9" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="ceramicIno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#F1F5F9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.85" />
    </linearGradient>
    <filter id="dropIno" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgIno)" rx="24" />

  <!-- Prepared Molar Tooth with Exploded / Fitted Ceramic Onlay -->
  <g filter="url(#dropIno)">
    <!-- Base Tooth with Cutaway Cavity -->
    <path d="M 300 200 
             C 300 140, 340 130, 370 140 
             L 370 200 
             L 470 200 
             L 470 140
             C 490 130, 500 150, 500 200 
             C 500 250, 485 290, 475 340 
             C 460 400, 450 420, 435 420 
             C 425 420, 420 360, 410 320 
             C 400 360, 395 420, 385 420 
             C 370 420, 360 400, 345 340 
             C 335 290, 300 250, 300 200 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" />

    <!-- Dentin Core with Box Cavity Preparation -->
    <path d="M 320 210 L 320 300 L 375 390 L 400 310 L 425 390 L 460 300 L 460 210 Z" 
          fill="#FEF9C3" stroke="#CA8A04" stroke-width="2" />

    <!-- Vital Pulp -->
    <path d="M 380 250 C 380 230, 420 230, 420 250 C 420 290, 415 330, 410 370 L 390 370 Z" 
          fill="#FDA4AF" stroke="#E11D48" stroke-width="1.5" />

    <!-- CAD/CAM Precision Milled Ceramic Onlay Piece (Seated in Cavity) -->
    <path d="M 365 140 
             C 365 110, 410 100, 435 110 
             C 460 100, 475 120, 475 140 
             L 475 195 
             L 365 195 Z" 
          fill="url(#ceramicIno)" stroke="#0D9488" stroke-width="3" stroke-linejoin="round" />

    <!-- Adhesive Resin Cement Line (Teal Border) -->
    <path d="M 365 195 L 475 195" stroke="#20B2AA" stroke-width="3" stroke-dasharray="3 2" />
  </g>

  <!-- Explanatory Callouts -->
  <rect x="130" y="130" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="220" y="151" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Preserved Sound Cusp</text>
  <line x1="310" y1="146" x2="350" y2="150" stroke="#0D9488" stroke-width="1.5" />

  <rect x="495" y="110" width="185" height="32" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="587" y="131" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Milled Ceramic Restoration</text>
  <line x1="495" y1="126" x2="445" y2="135" stroke="#0284C7" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">REST-INO-01 • Restorative Dentistry</text>
</svg>