<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAF9" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="dropPcp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D97706" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgPcp)" rx="24" />

  <!-- Tooth Molar Cross-Section with Pulp Cap -->
  <g filter="url(#dropPcp)">
    <!-- Enamel Shell -->
    <path d="M 310 180 
             C 310 120, 350 110, 380 120 
             C 390 125, 410 125, 420 120 
             C 450 110, 490 120, 490 180 
             C 490 230, 475 270, 465 320 
             C 450 380, 440 400, 425 400 
             C 415 400, 410 340, 400 300 
             C 390 340, 385 400, 375 400 
             C 360 400, 350 380, 335 320 
             C 325 270, 310 230, 310 180 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" />

    <!-- Dentin Core with Deep Excavated Cavity -->
    <path d="M 330 185 
             C 330 145, 360 135, 380 145 
             L 380 190 
             L 420 190 
             L 420 145
             C 440 135, 470 145, 470 185 
             C 470 225, 455 260, 450 300 
             L 350 300 Z" 
          fill="#FEF9C3" stroke="#CA8A04" stroke-width="2" />

    <!-- Vital Pulp Chamber & Canals -->
    <path d="M 385 220 C 385 195, 415 195, 415 220 C 415 260, 410 300, 405 360 L 395 360 Z" 
          fill="#FDA4AF" stroke="#E11D48" stroke-width="2" />

    <!-- Bioactive Mineralizing Pulp Cap Layer (MTA / Calcium Silicate) -->
    <rect x="382" y="195" width="36" height="12" rx="3" fill="#A7F3D0" stroke="#059669" stroke-width="2" />

    <!-- Protective Glass Ionomer Base Liner -->
    <rect x="380" y="175" width="40" height="20" rx="4" fill="#93C5FD" stroke="#2563EB" stroke-width="2" />

    <!-- Final Composite Cavity Seal -->
    <rect x="378" y="135" width="44" height="40" rx="4" fill="#F8FAFC" stroke="#0D9488" stroke-width="2" />
  </g>

  <!-- Technical Callouts -->
  <rect x="130" y="185" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
  <text x="220" y="206" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Bioactive MTA Pulp Cap</text>
  <line x1="310" y1="201" x2="382" y2="201" stroke="#059669" stroke-width="1.5" />

  <rect x="495" y="185" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" />
  <text x="585" y="206" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#BE123C" text-anchor="middle">Preserved Vital Pulp</text>
  <line x1="495" y1="201" x2="418" y2="220" stroke="#E11D48" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">REST-PCP-01 • Restorative Dentistry</text>
</svg>