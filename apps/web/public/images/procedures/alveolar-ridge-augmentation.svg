<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg6)" />

  <!-- Deficient Alveolar Basal Bone -->
  <path d="M 180 380 L 180 440 L 620 440 L 620 380 C 520 380 480 380 400 380 C 320 380 280 380 180 380 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />

  <!-- Decortication Holes in Native Bone -->
  <circle cx="340" cy="380" r="3" fill="#B91C1C" />
  <circle cx="380" cy="380" r="3" fill="#B91C1C" />
  <circle cx="420" cy="380" r="3" fill="#B91C1C" />
  <circle cx="460" cy="380" r="3" fill="#B91C1C" />

