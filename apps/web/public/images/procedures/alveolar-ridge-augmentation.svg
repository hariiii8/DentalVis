  <!-- Graft Particles Inside -->
  <g fill="#B45309">
    <circle cx="350" cy="340" r="4" /><circle cx="380" cy="320" r="5" /><circle cx="420" cy="330" r="4.5" />
    <circle cx="450" cy="350" r="5" /><circle cx="390" cy="355" r="4" /><circle cx="330" cy="360" r="4.5" />
  </g>

  <!-- Titanium-Reinforced Barrier Membrane -->
  <path d="M 270 385 C 285 270 515 270 530 385" stroke="#475569" stroke-width="3" fill="none" />

  <!-- Titanium Fixation Micro-Tacks / Screws -->
  <polygon points="268,380 274,380 271,395" fill="#334155" />
  <polygon points="528,380 534,380 531,395" fill="#334155" />

  <!-- Callouts -->
  <rect x="110" y="240" width="195" height="32" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.5" />
  <text x="207" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Titanium Barrier Membrane</text>
  <line x1="305" y1="256" x2="350" y2="280" stroke="#475569" stroke-width="1.5" />

  <rect x="495" y="240" width="195" height="32" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5" />
  <text x="592" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">Guided Bone Scaffold (GBR)</text>
  <line x1="495" y1="256" x2="450" y2="310" stroke="#B45309" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="270" y="445" width="260" height="26" rx="13" fill="#F3E8FF" stroke="#A855F7" stroke-width="1" />
  <text x="400" y="462" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7E22CE" text-anchor="middle">OMFS-RDG-01 • Specialist Tier 3</text>
