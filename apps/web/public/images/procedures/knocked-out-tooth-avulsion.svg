<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAvl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="50%" stop-color="#FEE2E2" />
      <stop offset="100%" stop-color="#FECACA" />
    </linearGradient>
    <linearGradient id="toothRootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="pdlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadowAvl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgAvl)" rx="16" />

  <!-- Jaw Alveolar Bone Cross Section -->
  <path d="M 120 120 L 420 120 C 430 180, 460 300, 480 340 C 470 350, 420 340, 390 320 C 370 290, 360 210, 360 160 L 120 160 Z" fill="#F87171" opacity="0.2" />

  <!-- Empty Alveolar Socket (Left Side) -->
  <g>
    <!-- Bone Ridge -->
    <path d="M 150 140 C 200 130, 240 130, 290 140 L 290 280 C 280 290, 260 320, 220 360 C 180 320, 160 290, 150 280 Z" fill="#991B1B" opacity="0.35" />
    <path d="M 160 150 C 200 140, 235 140, 275 150 L 275 270 C 265 285, 245 315, 220 345 C 190 315, 170 285, 160 270 Z" fill="#7F1D1D" opacity="0.75" />
    <text x="218" y="240" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FEE2E2" text-anchor="middle">Empty Socket</text>
  </g>

  <!-- Extruded Avulsed Permanent Tooth (Handled By Crown Only) -->
  <g transform="translate(480, 120) rotate(15)" filter="url(#shadowAvl)">
    <!-- Root with PDL Fibers -->
    <path d="M 20 160 C 20 110, 45 40, 60 10 C 75 40, 100 110, 100 160 Z" fill="url(#toothRootGrad)" stroke="#CBD5E1" stroke-width="2" />
    <!-- Delicate PDL Sheath on Root -->
    <path d="M 16 155 C 17 110, 42 42, 58 12" fill="none" stroke="url(#pdlGrad)" stroke-width="3.5" stroke-dasharray="3,3" />
    <path d="M 104 155 C 103 110, 78 42, 62 12" fill="none" stroke="url(#pdlGrad)" stroke-width="3.5" stroke-dasharray="3,3" />

    <!-- Crown (Safe Handling Zone) -->
    <path d="M 15 160 C 10 200, 12 250, 30 275 C 40 285, 80 285, 90 275 C 108 250, 110 200, 105 160 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
    <!-- Enamel Highlight -->
    <path d="M 28 175 C 24 210, 26 245, 36 260" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />

    <!-- Crown-Only Grip Symbol -->
    <circle cx="60" cy="225" r="22" fill="#10B981" opacity="0.2" />
    <circle cx="60" cy="225" r="16" fill="none" stroke="#059669" stroke-width="2.5" />
    <path d="M 52 225 L 58 231 L 69 220" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Directional Replantation Guide Arrow -->
  <path d="M 450 260 C 370 290, 320 280, 280 250" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="8,5" />
  <polygon points="275,250 288,245 285,258" fill="#DC2626" />

  <!-- Storage Media Warning / Badge -->
  <rect x="80" y="420" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" />
  <circle cx="100" cy="437" r="6" fill="#DC2626" />
  <text x="115" y="442" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#991B1B">Urgent: Transport in Cold Milk / HBSS</text>

  <rect x="420" y="420" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" />
  <circle cx="440" cy="437" r="6" fill="#16A34A" />
  <text x="455" y="442" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#166534">Handle Crown Only (Never Scrape Root)</text>

  <!-- Title Badge -->
  <rect x="40" y="35" width="280" height="34" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" />
  <circle cx="58" cy="52" r="6" fill="#DC2626" />
  <text x="74" y="57" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#991B1B">Knocked-Out Permanent Tooth</text>
</svg>
