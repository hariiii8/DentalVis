<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="crwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="ceramicSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CCFBF1" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#crwBg)" rx="24" />

  <!-- Placement Motion Arrows -->
  <path d="M 400 100 L 400 145" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />
  <polyline points="390,135 400,150 410,135" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <g filter="url(#shadow)">
    <!-- 1. Lower Prepared Natural Tooth Core (Abutment Prep) -->
    <path d="M 345 270 
             L 360 215 C 375 210, 425 210, 440 215 
             L 455 270 
             C 455 330, 440 370, 425 390 
             C 415 390, 410 340, 400 300 
             C 390 340, 385 390, 375 390 
             C 360 370, 345 330, 345 270 Z" 
          fill="#FEF9C3" stroke="#CA8A04" stroke-width="3" />

    <!-- 2. Upper Lifelike Ceramic Crown (Hovering / Seating onto prep) -->
    <path d="M 330 180 
             C 330 120, 360 110, 380 120 
             C 390 125, 410 125, 420 120 
             C 440 110, 470 120, 470 180 
             C 470 205, 460 210, 450 215 
             C 430 210, 370 210, 350 215 
             C 340 210, 330 205, 330 180 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" />

    <!-- Ceramic Crown Glaze Sheen -->
    <path d="M 350 145 Q 365 130 395 130 L 385 195 Q 360 195 345 175 Z" fill="url(#ceramicSheen)" />

    <!-- Luting Cement Bonding Layer (Teal Micro-Line) -->
    <line x1="360" y1="215" x2="440" y2="215" stroke="#0D9488" stroke-width="3" stroke-dasharray="4 2" />
  </g>

  <!-- Technical Callouts -->
  <rect x="180" y="140" width="130" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="245" y="161" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Zirconia / Ceramic</text>
  <line x1="310" y1="156" x2="340" y2="156" stroke="#0D9488" stroke-width="1.5" />

  <rect x="490" y="240" width="130" height="32" rx="8" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.5" />
  <text x="555" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#854D0E" text-anchor="middle">Prepared Tooth Core</text>
  <line x1="490" y1="256" x2="445" y2="256" stroke="#CA8A04" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="260" y="440" width="280" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#134E4A" text-anchor="middle">PROS-CRW-01 • Prosthodontic Restoration</text>
</svg>
