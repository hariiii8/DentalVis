<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="retBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="retWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="hawleyPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="toothWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="retShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#retBg)" rx="24" />

  <!-- Natural Healthy Aligned Dental Arch Margin -->
  <path d="M 180 320 Q 400 250 620 320 L 620 380 Q 400 330 180 380 Z" fill="#FDA4AF" opacity="0.75" />

  <!-- Perfectly Aligned Anterior Teeth (Post-Orthodontic Stability) -->
  <g>
    <!-- Premolar Left -->
    <rect x="200" y="220" width="45" height="90" rx="8" fill="url(#toothWhite)" stroke="#64748B" stroke-width="2" />
    <!-- Canine Left -->
    <path d="M 255 310 L 255 210 Q 275 190 295 210 L 295 310 Z" fill="url(#toothWhite)" stroke="#64748B" stroke-width="2" />
    <!-- Lateral Incisor Left -->
    <rect x="305" y="195" width="40" height="115" rx="6" fill="url(#toothWhite)" stroke="#64748B" stroke-width="2" />
    <!-- Central Incisor Left -->
    <rect x="355" y="180" width="40" height="130" rx="6" fill="url(#toothWhite)" stroke="#64748B" stroke-width="2.5" />
    <!-- Central Incisor Right -->
    <rect x="405" y="180" width="40" height="130" rx="6" fill="url(#toothWhite)" stroke="#64748B" stroke-width="2.5" />
    <!-- Lateral Incisor Right -->
    <rect x="455" y="195" width="40" height="115" rx="6" fill="url(#toothWhite)" stroke="#64748B" stroke-width="2" />
    <!-- Canine Right -->
    <path d="M 505 310 L 505 210 Q 525 190 545 210 L 545 310 Z" fill="url(#toothWhite)" stroke="#64748B" stroke-width="2" />
    <!-- Premolar Right -->
    <rect x="555" y="220" width="45" height="90" rx="8" fill="url(#toothWhite)" stroke="#64748B" stroke-width="2" />
  </g>

  <!-- Hawley Retainer Labial Bow & Acrylic Plate (Rendered across teeth) -->
  <g filter="url(#retShadow)">
    <!-- Continuous Labial Stainless Steel Retention Bow Wire -->
    <path d="M 220 250 L 260 250 C 265 215, 290 215, 295 250 L 505 250 C 510 215, 535 215, 540 250 L 580 250" 
          fill="none" stroke="url(#retWire)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Lingual Retention / Clear Acrylic Component Contour -->
    <path d="M 235 310 Q 400 270 565 310 L 550 360 Q 400 320 250 360 Z" 
          fill="url(#hawleyPink)" stroke="#BE123C" stroke-width="2" />

    <!-- Adjustment Omega Loops on Canines -->
    <circle cx="277" cy="225" r="8" fill="none" stroke="url(#retWire)" stroke-width="4" />
    <circle cx="523" cy="225" r="8" fill="none" stroke="url(#retWire)" stroke-width="4" />
  </g>

  <!-- Relapse Prevention Indicative Callout -->
  <g transform="translate(240, 415)">
    <rect width="320" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.9" stroke="#0284C7" stroke-width="1" />
    <text x="160" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369A1">
      Stabilizing Supra-Alveolar &amp; Periodontal Fibers
    </text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 45)">
    <rect width="300" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="24" cy="21" r="10" fill="#0284C7" />
    <path d="M 19 21 L 23 25 L 29 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">
      Orthodontic Retention Appliance
    </text>
  </g>
</svg>