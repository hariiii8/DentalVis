<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rctBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#rctBg)" rx="24" />

  <!-- Background Technical Grid Lines -->
  <line x1="200" y1="250" x2="600" y2="250" stroke="#0D9488" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <line x1="400" y1="80" x2="400" y2="420" stroke="#0D9488" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />

  <!-- Cross-Section of Molar during Endodontic Treatment -->
  <g filter="url(#shadow)">
    <!-- Enamel & Dentin Outer Wall -->
    <path d="M 310 180 
             C 310 120, 350 110, 380 120 
             C 390 125, 410 125, 420 120 
             C 450 110, 490 120, 490 180 
             C 490 230, 475 270, 465 320 
             C 450 380, 440 400, 425 400 
             C 415 400, 410 340, 400 300 
             C 390 340, 385 400, 375 400 
             C 360 400, 350 380, 335 320 
             C 325 270, 310 230, 310 180 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="6" stroke-linejoin="round" />

    <!-- Dentin Inner Wall (Warm Ivory) -->
    <path d="M 330 185 
             C 330 145, 360 135, 380 145 
             C 390 150, 410 150, 420 145 
             C 440 135, 470 145, 470 185 
             C 470 225, 455 260, 450 300 
             C 438 350, 432 375, 425 380 
             C 418 375, 410 325, 400 295 
             C 390 325, 382 375, 375 380 
             C 368 375, 362 350, 350 300 
             C 345 260, 330 225, 330 185 Z" 
          fill="#FEF9C3" stroke="#CA8A04" stroke-width="2" />

    <!-- Root Canal Sealed with Gutta-Percha (Biocompatible Warm Pink/Coral) -->
    <path d="M 370 200 
             C 370 180, 385 175, 400 175 
             C 415 175, 430 180, 430 200 
             C 430 230, 422 260, 418 290 
             C 415 325, 415 365, 412 375 
             C 409 365, 405 325, 400 295 
             C 395 325, 391 365, 388 375 
             C 385 365, 385 325, 382 290 
             C 378 260, 370 230, 370 200 Z" 
          fill="#FB7185" stroke="#E11D48" stroke-width="2.5" />

    <!-- Disinfected Chamber Clean Wave Indicator -->
    <circle cx="400" cy="205" r="8" fill="#0D9488" />
    <path d="M 396 205 L 399 208 L 405 202" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Technical Measurement Callouts -->
  <rect x="180" y="160" width="110" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="235" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Enamel / Dentin</text>
  <line x1="290" y1="176" x2="330" y2="176" stroke="#0D9488" stroke-width="1.5" />

  <rect x="510" y="270" width="130" height="32" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" />
  <text x="575" y="291" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9F1239" text-anchor="middle">Sealed Canal Chamber</text>
  <line x1="510" y1="286" x2="425" y2="286" stroke="#E11D48" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="260" y="440" width="280" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#134E4A" text-anchor="middle">ENDO-RCT-01 • Endodontic Procedure</text>
</svg>
