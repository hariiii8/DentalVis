<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="clnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="polishingCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="pasteGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#20B2AA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#clnBg)" rx="24" />

  <!-- Clean Radiant Sparkles & Luster Wave -->
  <path d="M 180 180 Q 220 160 260 200" fill="none" stroke="#20B2AA" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" />
  <circle cx="280" cy="150" r="4" fill="#20B2AA" />
  <circle cx="520" cy="140" r="5" fill="#20B2AA" />
  <circle cx="540" cy="180" r="3" fill="#20B2AA" />

  <!-- Tooth Profile with Prophylaxis Handpiece & Rubber Cup -->
  <g filter="url(#shadow)">
    <!-- Natural Healthy Molar Profile -->
    <path d="M 310 190 
             C 310 130, 350 120, 380 130 
             C 390 135, 410 135, 420 130 
             C 450 120, 490 130, 490 190 
             C 490 240, 475 280, 465 330 
             C 450 380, 440 400, 425 400 
             C 415 400, 410 340, 400 300 
             C 390 340, 385 400, 375 400 
             C 360 400, 350 380, 335 330 
             C 325 280, 310 240, 310 190 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="6" stroke-linejoin="round" />

    <!-- Healthy Pink Gingival Sulcus Profile -->
    <path d="M 280 270 C 330 260, 360 275, 400 268 C 440 275, 470 260, 520 270 L 520 380 C 460 395, 340 395, 280 380 Z" 
          fill="#FDA4AF" fill-opacity="0.5" stroke="#F43F5E" stroke-width="2" />

    <!-- Rotating Soft Rubber Prophy Cup -->
    <path d="M 460 130 L 515 95 L 530 115 L 485 145 Z" fill="url(#polishingCup)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <!-- Prophy Angle Drive Shaft -->
    <path d="M 520 105 L 590 60 L 610 85 L 540 130 Z" fill="#94A3B8" stroke="#475569" stroke-width="2" stroke-linejoin="round" />

    <!-- Fine Grain Prophylaxis Polishing Paste -->
    <path d="M 445 138 C 455 125, 475 135, 470 150 C 455 155, 440 150, 445 138 Z" fill="url(#pasteGlow)" stroke="#059669" stroke-width="1.5" />

    <!-- Mirror-Gloss Reflection Highlight on Enamel -->
    <path d="M 335 175 Q 355 145 385 145 L 375 220 Q 345 210 335 175 Z" fill="#FFFFFF" fill-opacity="0.7" />
  </g>

  <!-- Technical Callouts -->
  <rect x="150" y="130" width="150" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="225" y="151" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Glass-Smooth Enamel</text>
  <line x1="300" y1="146" x2="340" y2="160" stroke="#0D9488" stroke-width="1.5" />

  <rect x="495" y="60" width="165" height="32" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
  <text x="577" y="81" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">Prophy Polishing Cup</text>
  <line x1="535" y1="92" x2="505" y2="115" stroke="#059669" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="235" y="440" width="330" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">PREV-CLN-01 • Preventive Dental Care</text>
</svg>
