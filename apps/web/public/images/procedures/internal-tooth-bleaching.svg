<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIbl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAF9" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="bleachAura" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="dropIbl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgIbl)" rx="24" />

  <!-- Discolored Tooth Crown Restored From Within (Walking Bleach Pellet) -->
  <g filter="url(#dropIbl)">
    <!-- Left Half: Darkened Dentin; Right Half: Restored Pearl White -->
    <path d="M 330 220 
             C 330 160, 370 140, 400 140 
             C 430 140, 470 160, 470 220 
             L 460 360 
             L 340 360 Z" 
          fill="url(#bleachAura)" stroke="#0284C7" stroke-width="5" stroke-linejoin="round" />

    <!-- Root Canal Gutta-Percha in Lower Half -->
    <path d="M 400 270 L 400 360" stroke="#F87171" stroke-width="8" stroke-linecap="round" />

    <!-- Glass Ionomer Cervical Barrier (2mm Seal) -->
    <rect x="385" y="248" width="30" height="18" rx="3" fill="#93C5FD" stroke="#2563EB" stroke-width="2" />

    <!-- Intracoronal Bleaching Agent Pellet (Sodium Perborate) -->
    <circle cx="400" cy="215" r="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" />
    <circle cx="400" cy="215" r="8" fill="#38BDF8" opacity="0.6" />

    <!-- Oxygen Effervescence Bubbles -->
    <circle cx="385" cy="185" r="3" fill="#38BDF8" />
    <circle cx="415" cy="175" r="4" fill="#38BDF8" />
    <circle cx="395" cy="165" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Technical Callouts -->
  <rect x="120" y="195" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="210" y="216" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Active Oxidizing Pellet</text>
  <line x1="300" y1="211" x2="385" y2="215" stroke="#0284C7" stroke-width="1.5" />

  <rect x="495" y="240" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <text x="585" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">2mm Cervical Barrier Seal</text>
  <line x1="495" y1="256" x2="415" y2="256" stroke="#2563EB" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0C4A6E" text-anchor="middle">ENDO-IBL-01 • Endodontics</text>
</svg>