<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="bandSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="loopWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="spmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#059669" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#spmBg)" rx="24" />

  <!-- Gingival Margin & Edentulous Gap -->
  <path d="M 140 330 Q 400 300 660 330 L 660 450 L 140 450 Z" fill="#FECDD3" opacity="0.8" />
  
  <!-- Developing Permanent Premolar (Erupting underneath the preserved space) -->
  <g>
    <!-- Tooth Crypt in Bone -->
    <path d="M 330 360 C 330 330, 470 330, 470 360 C 470 410, 330 410, 330 360 Z" 
          fill="#FEF08A" stroke="#CA8A04" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />
    <!-- Developing Crown -->
    <path d="M 360 360 C 360 345, 440 345, 440 360 C 440 380, 360 380, 360 360 Z" fill="#FFFFFF" stroke="#475569" stroke-width="1.5" />
    <text x="400" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#854D0E">
      Developing Permanent Premolar
    </text>
  </g>

  <!-- Teeth Rows -->
  <!-- Anterior Primary Canine (Tooth touching loop) -->
  <g>
    <path d="M 230 330 L 230 220 Q 255 195 280 220 L 280 330 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
    <text x="255" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Canine</text>
  </g>

  <!-- Posterior Anchor Molar (Permanent First Molar or Primary Second Molar) -->
  <g>
    <rect x="520" y="210" width="70" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
    <path d="M 540 210 L 540 240 M 570 210 L 570 240" stroke="#CBD5E1" stroke-width="2" />
    <text x="555" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Molar</text>
  </g>

  <!-- Fixed Band-and-Loop Space Maintainer Assembly -->
  <g filter="url(#spmShadow)">
    <!-- Molar Band (Cemented tightly on anchor molar) -->
    <rect x="515" y="230" width="80" height="60" rx="8" fill="none" stroke="url(#bandSteel)" stroke-width="6" />

    <!-- Solder Joint on Buccal & Lingual Aspects -->
    <circle cx="515" cy="250" r="5" fill="#334155" />
    <circle cx="515" cy="270" r="5" fill="#334155" />

    <!-- Cantilever Stainless Steel Wire Loop Bridging the Space (x=515 to x=280) -->
    <path d="M 515 250 L 300 250 C 285 250, 280 260, 280 265 C 280 270, 285 280, 300 280 L 515 280" 
          fill="none" stroke="url(#loopWire)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Passive Rest Contact against Canine -->
    <path d="M 280 265 L 285 265" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Arch Length Preservation Callout -->
  <g transform="translate(290, 160)">
    <rect width="220" height="30" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
    <text x="110" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065F46">
      Preserves Leeway Arch Space
    </text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(235, 45)">
    <rect width="330" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#059669" stroke-width="1.5" />
    <circle cx="24" cy="21" r="10" fill="#059669" />
    <path d="M 19 21 L 23 25 L 29 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#064E3B">
      Pediatric Space Maintainer (Band &amp; Loop)
    </text>
  </g>
</svg>