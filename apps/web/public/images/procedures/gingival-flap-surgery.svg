<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="gumFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Alveolar Bone with Infrabony Defect -->
  <path d="M 180 340 L 180 440 L 620 440 L 620 340 L 520 340 C 490 340 470 370 450 380 C 420 395 380 395 350 380 C 330 370 310 340 280 340 Z" fill="url(#boneGrad)" stroke="#D97706" stroke-width="2" />
  
  <!-- Tooth Root & Crown -->
  <path d="M 360 80 C 370 70 430 70 440 80 C 455 120 455 200 445 250 C 435 290 420 380 405 410 C 395 410 380 380 365 290 C 355 240 345 120 360 80 Z" fill="url(#toothGrad)" stroke="#94A3B8" stroke-width="2.5" />
  
  <!-- Subgingival Calculus Deposit on Root -->
  <ellipse cx="370" cy="310" rx="8" ry="14" fill="#78350F" opacity="0.85" />
  <ellipse cx="430" cy="320" rx="7" ry="12" fill="#78350F" opacity="0.85" />

  <!-- Reflected Gum Flap (Left & Right folded back) -->
  <path d="M 280 340 C 260 300 240 280 230 260 C 250 250 280 270 300 300 C 310 320 310 340 280 340 Z" fill="url(#gumFlap)" stroke="#BE123C" stroke-width="2" />
  <path d="M 520 340 C 540 300 560 280 570 260 C 550 250 520 270 500 300 C 490 320 490 340 520 340 Z" fill="url(#gumFlap)" stroke="#BE123C" stroke-width="2" />

  <!-- Sutures Indicator at Interdental Crest -->
  <circle cx="280" cy="340" r="4" fill="#0284C7" />
  <circle cx="520" cy="340" r="4" fill="#0284C7" />

  <!-- Educational Annotations -->
  <rect x="110" y="240" width="190" height="32" rx="8" fill="#FFFFFF" stroke="#BE123C" stroke-width="1.5" />
  <text x="205" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9F1239" text-anchor="middle">Elevated Flap & Calculus</text>
  <line x1="300" y1="256" x2="365" y2="305" stroke="#BE123C" stroke-width="1.5" stroke-dasharray="3,3" />

  <rect x="500" y="240" width="190" height="32" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5" />
  <text x="595" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Root Debridement Access</text>
  <line x1="500" y1="256" x2="435" y2="315" stroke="#047857" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Department & Code Pill -->
  <rect x="290" y="445" width="220" height="26" rx="13" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
  <text x="400" y="462" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">PERIO-FLP-01 • Periodontics</text>
</svg>