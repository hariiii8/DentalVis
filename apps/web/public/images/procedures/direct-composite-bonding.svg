<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAF9" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <linearGradient id="resinBnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#F8FAFC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>
    <filter id="dropBnd" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgBnd)" rx="24" />

  <!-- Maxillary Central Incisor with Chipped Edge & Sculpted Composite -->
  <g filter="url(#dropBnd)">
    <!-- Natural Tooth Body (Incisor Crown & Root) -->
    <path d="M 330 220 
             C 330 160, 370 140, 400 140 
             C 430 140, 470 160, 470 220 
             L 470 310 
             L 415 310 
             L 375 260 
             L 330 260 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" />

    <!-- Incisor Single Root -->
    <path d="M 360 140 C 370 80, 430 80, 440 140 Z" fill="#F8FAFC" stroke="#0D9488" stroke-width="4" />

    <!-- Sculpted Aesthetic Composite Restoring Incisal Angle -->
    <path d="M 330 260 
             L 375 260 
             L 415 310 
             L 330 310 Z" 
          fill="url(#resinBnd)" stroke="#0D9488" stroke-width="3" stroke-linejoin="round" />

    <!-- Beveled Enamel Transition Line -->
    <line x1="330" y1="260" x2="415" y2="310" stroke="#20B2AA" stroke-width="2" stroke-dasharray="3 2" />
  </g>

  <!-- Technical Callouts -->
  <rect x="130" y="240" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="220" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Layered Composite Resin</text>
  <line x1="310" y1="256" x2="350" y2="280" stroke="#0D9488" stroke-width="1.5" />

  <rect x="495" y="240" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="585" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Enamel Micro-Bevel Blend</text>
  <line x1="495" y1="256" x2="430" y2="280" stroke="#0284C7" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">REST-BND-01 • Restorative Dentistry</text>
</svg>