<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sscBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="austeniticSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="90%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="glassIonomer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="sscGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#334155" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#sscBg)" rx="24" />

  <!-- Gingival Margin Bed (Pediatric Primary Molar Region) -->
  <path d="M 180 310 Q 400 280 620 310 L 620 440 L 180 440 Z" fill="#FECDD3" opacity="0.8" />
  <path d="M 180 300 Q 280 270 380 300 Q 480 270 620 300" fill="none" stroke="#E11D48" stroke-width="2.5" />

  <!-- Natural Primary Roots Anchored in Bone -->
  <g>
    <path d="M 300 310 C 290 360, 260 410, 240 435 C 260 435, 290 400, 320 330 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="2" />
    <path d="M 500 310 C 510 360, 540 410, 560 435 C 540 435, 510 400, 480 330 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="2" />
  </g>

  <!-- Preformed Metal Crown (Stainless Steel Crown) -->
  <g filter="url(#sscGlow)">
    <!-- Bioactive Glass Ionomer Cement Layer (Under Crown) -->
    <path d="M 270 300 L 270 190 Q 400 170 530 190 L 530 300 Q 400 315 270 300 Z" 
          fill="url(#glassIonomer)" stroke="#CA8A04" stroke-width="2" opacity="0.9" />
    <text x="400" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#854D0E">
      Bioactive Glass Ionomer Cement Luting
    </text>

    <!-- Full-Coverage Preformed Stainless Steel Crown (Austenitic Steel Alloy) -->
    <path d="M 260 305 C 260 220, 265 170, 310 160 Q 400 145 490 160 C 535 170, 540 220, 540 305 C 540 315, 520 315, 510 308 Q 400 300 290 308 C 280 315, 260 315, 260 305 Z" 
          fill="url(#austeniticSteel)" stroke="#0F172A" stroke-width="3" />

    <!-- Anatomical Molar Cusps & Grooves on Crown Occlusal Table -->
    <path d="M 310 160 Q 355 175 400 160 Q 445 175 490 160" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="355" cy="180" r="4" fill="#334155" />
    <circle cx="445" cy="180" r="4" fill="#334155" />

    <!-- Specular Light Reflection Streak -->
    <path d="M 285 200 L 300 200 L 320 280 L 305 280 Z" fill="#FFFFFF" fill-opacity="0.35" />

    <!-- Crimped Cervical Snap Margin (Tucked neatly at gingival line) -->
    <path d="M 260 305 Q 400 295 540 305" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 360-degree Seal Indicator Callout -->
  <g transform="translate(230, 420)">
    <rect width="340" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.95" stroke="#475569" stroke-width="1.5" />
    <text x="170" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">
      360° Coronal Seal • Prevents Recurrent Decay
    </text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(230, 45)">
    <rect width="340" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#475569" stroke-width="1.5" />
    <circle cx="24" cy="21" r="10" fill="#475569" />
    <path d="M 19 21 L 23 25 L 29 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">
      Pediatric Stainless Steel Crown (SSC)
    </text>
  </g>
</svg>