<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="tiGrad10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="fullArchZirconia" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg10)" />

  <!-- Edentulous Mandibular Jawbone Arch (Curved Ridge) -->
  <path d="M 160 330 C 260 360 540 360 640 330 L 640 440 L 160 440 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />

  <!-- Four Strategic Implants (All-on-4 Concept: 2 straight anterior, 2 tilted posterior) -->
  <!-- Posterior Left Tilted (30 degrees) -->
  <g transform="rotate(25, 250, 340)">
    <path d="M 235 340 L 265 340 L 260 420 L 240 420 Z" fill="url(#tiGrad10)" stroke="#475569" stroke-width="1.5" />
  </g>
  <!-- Anterior Left Straight -->
  <path d="M 335 340 L 365 340 L 360 420 L 340 420 Z" fill="url(#tiGrad10)" stroke="#475569" stroke-width="1.5" />
  <!-- Anterior Right Straight -->
  <path d="M 435 340 L 465 340 L 460 420 L 440 420 Z" fill="url(#tiGrad10)" stroke="#475569" stroke-width="1.5" />
  <!-- Posterior Right Tilted (-30 degrees) -->
  <g transform="rotate(-25, 550, 340)">
    <path d="M 535 340 L 565 340 L 560 420 L 540 420 Z" fill="url(#tiGrad10)" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Complete Full-Arch Prosthetic Bridge (Continuous Tooth Arch with Pink Gingival Composite Base) -->
  <path d="M 180 280 C 260 300 540 300 620 280 L 625 240 C 545 220 255 220 175 240 Z" fill="#FB7185" stroke="#E11D48" stroke-width="1.5" />
  
  <!-- Continuous Full-Arch Crown Row -->
  <path d="M 180 240 C 260 210 540 210 620 240 C 600 170 540 160 400 160 C 260 160 200 170 180 240 Z" fill="url(#fullArchZirconia)" stroke="#94A3B8" stroke-width="2" />

  <!-- Multiple Teeth Outline Lines -->
  <line x1="240" y1="230" x2="250" y2="180" stroke="#CBD5E1" stroke-width="1" />
  <line x1="300" y1="240" x2="310" y2="170" stroke="#CBD5E1" stroke-width="1" />
  <line x1="365" y1="245" x2="370" y2="165" stroke="#CBD5E1" stroke-width="1" />
  <line x1="435" y1="245" x2="430" y2="165" stroke="#CBD5E1" stroke-width="1" />
  <line x1="500" y1="240" x2="490" y2="170" stroke="#CBD5E1" stroke-width="1" />
  <line x1="560" y1="230" x2="550" y2="180" stroke="#CBD5E1" stroke-width="1" />

  <!-- Callouts -->
  <rect x="110" y="190" width="195" height="32" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="207" y="211" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Full-Arch Fixed Zirconia</text>
  <line x1="305" y1="206" x2="360" y2="200" stroke="#0284C7" stroke-width="1.5" />

  <rect x="495" y="350" width="195" height="32" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.5" />
  <text x="592" y="371" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Strategic Angled Implants</text>
  <line x1="495" y1="366" x2="455" y2="380" stroke="#475569" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="270" y="445" width="260" height="26" rx="13" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
  <text x="400" y="462" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">IMPL-FLA-01 • Specialist Tier 3</text>
</svg>