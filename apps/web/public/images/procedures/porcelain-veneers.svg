<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="veneerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <linearGradient id="gumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="shadowVen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgVen)" rx="16" />

  <!-- Background Decorative Grid Lines -->
  <path d="M 100 0 L 100 500 M 200 0 L 200 500 M 600 0 L 600 500 M 700 0 L 700 500" stroke="#93C5FD" stroke-width="0.7" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Gingival Margin Arch -->
  <path d="M 220 180 C 270 120, 350 120, 400 170 C 450 120, 530 120, 580 180 L 580 80 L 220 80 Z" fill="url(#gumGrad)" opacity="0.85" />

  <!-- Central Incisor Prepared Tooth Substrate (Base Tooth) -->
  <g filter="url(#shadowVen)">
    <path d="M 280 170 C 285 220, 290 320, 305 380 C 315 400, 385 400, 395 380 C 410 320, 415 220, 420 170 C 370 155, 330 155, 280 170 Z" fill="url(#toothGrad)" stroke="#94A3B8" stroke-width="2.5" />
    <!-- Prepared Facial Reduction Shelf / Chamfer Finish Line -->
    <path d="M 295 185 C 298 230, 302 315, 312 365 C 320 380, 375 380, 385 365 C 395 315, 402 230, 405 185" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Adjacent Lateral Incisor Outline -->
  <path d="M 435 180 C 440 220, 445 300, 455 350 C 462 365, 505 365, 515 350 C 525 300, 530 220, 535 180 C 495 168, 465 168, 435 180 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" opacity="0.7" />

  <!-- Detached / Exploded Porcelain Veneer Shell -->
  <g filter="url(#shadowVen)">
    <path d="M 460 175 C 468 225, 475 320, 485 375 C 492 392, 545 392, 555 375 C 568 320, 575 225, 580 175 C 540 162, 500 162, 460 175 Z" fill="url(#veneerGrad)" stroke="#0284C7" stroke-width="2.5" opacity="0.92" />
    <!-- Translucent Ceramic Highlights -->
    <path d="M 475 200 C 480 240, 485 310, 492 355" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 495 378 L 545 378" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Adhesive Placement Guide Arrows -->
  <g stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 450 270 L 415 270" marker-end="url(#arrow)" />
    <path d="M 450 270 L 420 270" />
    <polygon points="415,270 425,265 425,275" fill="#0284C7" />
  </g>

  <!-- Labels / Annotation Badges -->
  <rect x="230" y="420" width="160" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="310" y="441" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Prepared Enamel Face</text>

  <rect x="460" y="420" width="170" height="32" rx="8" fill="#0284C7" />
  <text x="545" y="441" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Custom Ceramic Shell</text>

  <!-- Title Badge -->
  <rect x="40" y="35" width="230" height="34" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
  <circle cx="58" cy="52" r="6" fill="#0284C7" />
  <text x="74" y="57" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369A1">Custom Porcelain Veneers</text>
</svg>
