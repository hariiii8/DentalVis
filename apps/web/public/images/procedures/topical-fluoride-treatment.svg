<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFlu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAF9" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="varnishSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0.7" />
    </linearGradient>
    <filter id="dropFlu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgFlu)" rx="24" />

  <!-- Tooth with Protective Fluoride Varnish Coat -->
  <g filter="url(#dropFlu)">
    <!-- Base Tooth Enamel -->
    <path d="M 320 180 
             C 320 110, 370 100, 400 110 
             C 430 100, 480 110, 480 180 
             C 480 240, 465 290, 455 340 
             C 445 390, 435 410, 420 410 
             C 410 410, 405 340, 400 290 
             C 395 340, 390 410, 380 410 
             C 365 410, 355 390, 345 340 
             C 335 290, 320 240, 320 180 Z" 
          fill="#FFFFFF" stroke="#0284C7" stroke-width="6" stroke-linejoin="round" />

    <!-- Dentin Core -->
    <path d="M 340 185 
             C 340 135, 380 125, 400 135 
             C 420 125, 460 135, 460 185 
             C 460 235, 445 280, 440 330 
             C 430 380, 420 395, 415 395 
             C 408 380, 402 330, 400 285 
             C 398 330, 392 380, 385 395 
             C 380 395, 370 380, 360 330 
             C 355 280, 340 235, 340 185 Z" 
          fill="#FEF9C3" stroke="#CA8A04" stroke-width="2" />

    <!-- Vital Pulp -->
    <path d="M 385 220 C 385 190, 415 190, 415 220 C 415 260, 410 310, 405 350 L 395 350 Z" 
          fill="#FDA4AF" stroke="#E11D48" stroke-width="1.5" />

    <!-- Golden Protective Fluoride Varnish Film (Enamel Coating) -->
    <path d="M 315 180 
             C 315 105, 368 95, 400 105 
             C 432 95, 485 105, 485 180 
             C 485 240, 470 290, 460 340 
             C 455 360, 452 355, 448 330
             C 458 285, 475 235, 475 180
             C 475 118, 430 108, 400 118
             C 370 108, 325 118, 325 180
             C 325 235, 342 285, 352 330
             C 348 355, 345 360, 340 340
             C 330 290, 315 240, 315 180 Z" 
          fill="url(#varnishSheen)" stroke="#CA8A04" stroke-width="1.5" />
  </g>

  <!-- Micro-applicator brush tip -->
  <path d="M 540 80 L 460 140 L 450 130 L 530 70 Z" fill="#64748B" stroke="#475569" stroke-width="2" />
  <circle cx="453" cy="136" r="9" fill="#FACC15" stroke="#EAB308" stroke-width="1.5" />

  <!-- Mineral Remineralization Callouts -->
  <rect x="120" y="140" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="210" y="161" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Fluorapatite Formation</text>
  <line x1="300" y1="156" x2="350" y2="156" stroke="#0284C7" stroke-width="1.5" />

  <rect x="495" y="180" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.5" />
  <text x="585" y="201" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#854D0E" text-anchor="middle">5% NaF Varnish Shield</text>
  <line x1="495" y1="196" x2="445" y2="196" stroke="#CA8A04" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0C4A6E" text-anchor="middle">PREV-FLU-01 • Preventive Dentistry</text>
</svg>