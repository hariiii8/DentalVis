<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="implBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <linearGradient id="tiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#implBg)" rx="24" />

  <!-- Trabecular Jawbone Ridge Structure -->
  <path d="M 240 280 Q 400 260 560 280 L 560 420 L 240 420 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
  <!-- Micro Bone Trabeculae Texture -->
  <circle cx="320" cy="340" r="16" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="480" cy="340" r="16" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4" />

  <g filter="url(#shadow)">
    <!-- 1. Lifelike Porcelain Implant Crown -->
    <path d="M 360 200 
             C 360 130, 375 115, 400 120 
             C 425 115, 440 130, 440 200 
             L 440 220 L 360 220 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" />

    <!-- 2. Custom Titanium Abutment Connection Collar -->
    <polygon points="375,220 425,220 415,250 385,250" fill="url(#tiGrad)" stroke="#1E293B" stroke-width="2" />

    <!-- 3. Precision Threaded Titanium Implant Body (In Bone) -->
    <path d="M 385 250 L 415 250 L 410 370 L 400 385 L 390 370 Z" fill="url(#tiGrad)" stroke="#1E293B" stroke-width="2" />
    
    <!-- Micro-Threads for Secure Osseointegration -->
    <line x1="384" y1="270" x2="416" y2="270" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="385" y1="290" x2="415" y2="290" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="386" y1="310" x2="414" y2="310" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="387" y1="330" x2="413" y2="330" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="388" y1="350" x2="412" y2="350" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Technical Callouts -->
  <rect x="190" y="140" width="130" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="255" y="161" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Porcelain Crown</text>
  <line x1="320" y1="156" x2="365" y2="156" stroke="#0D9488" stroke-width="1.5" />

  <rect x="500" y="210" width="130" height="32" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" />
  <text x="565" y="231" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E293B" text-anchor="middle">Custom Abutment</text>
  <line x1="500" y1="226" x2="420" y2="235" stroke="#334155" stroke-width="1.5" />

  <rect x="500" y="320" width="140" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="570" y="341" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0D9488" text-anchor="middle">Titanium Fixture</text>
  <line x1="500" y1="336" x2="415" y2="336" stroke="#0D9488" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#134E4A" text-anchor="middle">IMPL-SNGL-01 • Implantology &amp; Oral Surgery</text>
</svg>
