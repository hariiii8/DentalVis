<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAF9" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <filter id="dropRet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgRet)" rx="24" />

  <!-- Tooth Molar Cross-Section Showing Canal Retreatment Instrument & Apical Debridement -->
  <g filter="url(#dropRet)">
    <!-- Outer Molar Shell -->
    <path d="M 310 160 
             C 310 110, 350 100, 380 110 
             C 390 115, 410 115, 420 110 
             C 450 100, 490 110, 490 160 
             C 490 220, 475 270, 465 320 
             C 450 380, 440 400, 425 400 
             C 415 400, 410 340, 400 300 
             C 390 340, 385 400, 375 400 
             C 360 400, 350 380, 335 320 
             C 325 270, 310 220, 310 160 Z" 
          fill="#FFFFFF" stroke="#0D9488" stroke-width="5" stroke-linejoin="round" />

    <!-- Dentin Core with Coronal Access Hole -->
    <path d="M 330 170 L 375 170 L 375 220 L 425 220 L 425 170 L 470 170 C 470 220, 450 300, 435 370 L 365 370 Z" 
          fill="#FEF9C3" stroke="#CA8A04" stroke-width="2" />

    <!-- Mesial Canal: Old Gutta-Percha Being Dissolved/Removed -->
    <path d="M 380 220 L 365 370" stroke="#F87171" stroke-width="8" stroke-linecap="round" />
    <!-- Distal Canal: Cleaned & Disinfected Root Canal -->
    <path d="M 420 220 L 435 370" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />

    <!-- Microscopic Endodontic File Entering Mesial Canal -->
    <line x1="390" y1="90" x2="368" y2="330" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    <circle cx="390" cy="90" r="6" fill="#0284C7" />

    <!-- Apical Inflammatory Radiolucency (Healing Bone Defect) -->
    <ellipse cx="363" cy="385" rx="18" ry="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 2" />
  </g>

  <!-- Technical Callouts -->
  <rect x="120" y="160" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="210" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Microscopic Canal Access</text>
  <line x1="300" y1="176" x2="385" y2="120" stroke="#0284C7" stroke-width="1.5" />

  <rect x="495" y="320" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="585" y="341" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Ultrasonic Disinfection</text>
  <line x1="495" y1="336" x2="435" y2="336" stroke="#0D9488" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">ENDO-RET-01 • Endodontics</text>
</svg>