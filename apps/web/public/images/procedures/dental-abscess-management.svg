  <rect x="495" y="380" width="195" height="32" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
  <text x="592" y="401" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">Incision &amp; Drainage Path</text>
