<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="crdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <linearGradient id="denturePink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="ridgePink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="crdGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#crdBg)" rx="24" />

  <!-- Atmospheric Peripheral Suction Indicator Waves -->
  <path d="M 200 370 Q 400 340 600 370" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 6" opacity="0.3" />
  <path d="M 180 390 Q 400 360 620 390" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.2" />

  <!-- Alveolar Ridge Tissue Bed -->
  <path d="M 160 380 Q 400 340 640 380 C 660 410, 640 440, 600 450 Q 400 420 200 450 C 160 440, 140 410, 160 380 Z" 
        fill="url(#ridgePink)" stroke="#FB7185" stroke-width="2" opacity="0.8" />
  <text x="400" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#BE123C">
    Edentulous Alveolar Ridge &amp; Mucosa Support
  </text>

  <!-- Complete Denture Prosthesis Assembly -->
  <g filter="url(#crdGlow)">
    <!-- Contoured Pink Acrylic Denture Flange / Baseplate -->
    <path d="M 170 270 Q 400 230 630 270 C 650 340, 630 360, 580 365 Q 400 335 220 365 C 170 360, 150 340, 170 270 Z" 
          fill="url(#denturePink)" stroke="#BE123C" stroke-width="3.5" />
    
    <!-- Denture Acrylic Gingival Festooning -->
    <path d="M 230 275 Q 260 255 290 275 Q 320 255 350 275 Q 400 250 450 275 Q 480 255 510 275 Q 540 255 570 275" 
          fill="none" stroke="#FFF1F2" stroke-width="3" opacity="0.6" />

    <!-- Full Arch Denture Teeth (Molars to Central Incisors) -->
    <!-- Left Molar / Premolars -->
    <rect x="200" y="220" width="35" height="55" rx="8" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2" />
    <rect x="240" y="200" width="36" height="75" rx="8" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2" />
    <!-- Canine Left -->
    <path d="M 282 275 L 282 185 Q 298 165 316 185 L 316 275 Z" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2" />
    <!-- Lateral Incisor Left -->
    <rect x="322" y="165" width="34" height="110" rx="6" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2" />
    <!-- Central Incisor Left -->
    <rect x="360" y="150" width="38" height="125" rx="6" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2.5" />
    
    <!-- Central Incisor Right -->
    <rect x="402" y="150" width="38" height="125" rx="6" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2.5" />
    <!-- Lateral Incisor Right -->
    <rect x="444" y="165" width="34" height="110" rx="6" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2" />
    <!-- Canine Right -->
    <path d="M 484 275 L 484 185 Q 502 165 518 185 L 518 275 Z" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2" />
    <!-- Right Molar / Premolars -->
    <rect x="524" y="200" width="36" height="75" rx="8" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2" />
    <rect x="565" y="220" width="35" height="55" rx="8" fill="url(#toothGrad)" stroke="#1E293B" stroke-width="2" />
  </g>

  <!-- Explanatory Badge -->
  <g transform="translate(240, 45)">
    <rect width="320" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.9" stroke="#3B82F6" stroke-width="1.5" />
    <circle cx="24" cy="21" r="10" fill="#3B82F6" />
    <path d="M 19 21 L 23 25 L 29 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">
      Complete Removable Denture
    </text>
  </g>
</svg>