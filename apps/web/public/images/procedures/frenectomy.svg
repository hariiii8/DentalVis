<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="toothGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)" />

  <!-- Upper Gums -->
  <path d="M 180 180 C 260 210 320 210 360 210 C 380 210 390 200 400 170 C 410 200 420 210 440 210 C 480 210 540 210 620 180 L 620 90 L 180 90 Z" fill="#FB7185" stroke="#E11D48" stroke-width="2" />

  <!-- Two Central Incisors with Midline Diastema (Gap) -->
  <path d="M 320 210 L 320 370 C 320 380 375 380 385 370 L 385 210 Z" fill="url(#toothGrad4)" stroke="#94A3B8" stroke-width="2.5" />
  <path d="M 415 210 L 415 370 C 425 380 480 380 480 370 L 480 210 Z" fill="url(#toothGrad4)" stroke="#94A3B8" stroke-width="2.5" />

  <!-- Upper Lip Mucosa & Prominent Labial Frenum -->
  <path d="M 385 100 Q 400 120 400 185 Q 400 120 415 100 Z" fill="#E11D48" stroke="#9F1239" stroke-width="2" />

  <!-- Precision Surgical Release Laser / Incision Line -->
  <line x1="380" y1="150" x2="420" y2="150" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="2,4" />

  <!-- Annotations -->
  <rect x="110" y="130" width="195" height="32" rx="8" fill="#FFFFFF" stroke="#BE123C" stroke-width="1.5" />
  <text x="207" y="151" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9F1239" text-anchor="middle">Restrictive Labial Frenum</text>
  <line x1="305" y1="146" x2="390" y2="145" stroke="#BE123C" stroke-width="1.5" />

  <rect x="495" y="270" width="195" height="32" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <text x="592" y="291" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Midline Diastema Space</text>
  <line x1="495" y1="286" x2="415" y2="290" stroke="#0284C7" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="290" y="445" width="220" height="26" rx="13" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
  <text x="400" y="462" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">PERIO-FRN-01 • Periodontics</text>
</svg>