<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="whtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#DCEFF5" />
    </linearGradient>
    <linearGradient id="bleachSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <linearGradient id="gingivalBarrier" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#whtBg)" rx="24" />

  <!-- Radiant Oxygen Radical Sparkle Elements -->
  <!-- Sparkle 1 -->
  <path d="M 400 80 L 405 95 L 420 100 L 405 105 L 400 120 L 395 105 L 380 100 L 395 95 Z" fill="#20B2AA" />
  <!-- Sparkle 2 -->
  <path d="M 260 140 L 263 150 L 273 153 L 263 156 L 260 166 L 257 156 L 247 153 L 257 150 Z" fill="#20B2AA" fill-opacity="0.8" />
  <!-- Sparkle 3 -->
  <path d="M 540 130 L 543 140 L 553 143 L 543 146 L 540 156 L 537 146 L 527 143 L 537 140 Z" fill="#20B2AA" fill-opacity="0.8" />

  <!-- Contrast Side-by-Side Dental Arch: Pre-Treatment Stained (Left) vs Post-Treatment Brilliant White (Right) -->
  <g filter="url(#shadow)">
    <!-- 1. Left Central Incisor (Before Whitening: Natural Warm Chromophore Stains) -->
    <path d="M 330 180 
             C 330 130, 350 120, 385 120 
             C 400 120, 415 130, 415 180 
             L 415 320 
             C 415 325, 330 325, 330 320 Z" 
          fill="#FEF9C3" stroke="#CA8A04" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Micro Tea/Coffee Chromophore Pigment Map on Left Tooth -->
    <path d="M 345 200 Q 375 220 385 200 Q 405 230 395 270 Q 365 290 350 260 Z" fill="#FDE047" fill-opacity="0.6" />

    <!-- 2. Right Central Incisor (After Whitening: Radiant Luminous Enamel) -->
    <path d="M 425 180 
             C 425 130, 445 120, 480 120 
             C 495 120, 510 130, 510 180 
             L 510 320 
             C 510 325, 425 325, 425 320 Z" 
          fill="url(#bleachSheen)" stroke="#0D9488" stroke-width="4" stroke-linejoin="round" />

    <!-- Pure Reflection Sheen Streak on Whitened Tooth -->
    <path d="M 445 150 Q 470 140 485 150 L 475 280 Q 455 270 445 150 Z" fill="#FFFFFF" fill-opacity="0.8" />

    <!-- Protective Resin Gingival Barrier (Blue Dam along Gumline) -->
    <path d="M 310 170 Q 370 140 420 170 Q 470 140 530 170 L 530 130 L 310 130 Z" 
          fill="url(#gingivalBarrier)" stroke="#2563EB" stroke-width="2.5" />

    <!-- Comparison Dividing Axis Marker (Center Micro-Indicator) -->
    <line x1="420" y1="120" x2="420" y2="330" stroke="#0D9488" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6" />
  </g>

  <!-- Technical Callouts -->
  <rect x="150" y="240" width="165" height="32" rx="8" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.5" />
  <text x="232" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#854D0E" text-anchor="middle">Pre-Treatment Staining</text>
  <line x1="315" y1="256" x2="350" y2="256" stroke="#CA8A04" stroke-width="1.5" />

  <rect x="525" y="240" width="165" height="32" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="607" y="261" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#134E4A" text-anchor="middle">Active Oxygen Whitened</text>
  <line x1="525" y1="256" x2="490" y2="256" stroke="#0D9488" stroke-width="1.5" />

  <!-- Protective Blue Dam Indicator -->
  <rect x="495" y="90" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <text x="585" y="111" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Light-Cured Gingival Barrier</text>
  <line x1="535" y1="122" x2="500" y2="145" stroke="#2563EB" stroke-width="1.5" />

  <!-- Department & Code Pill -->
  <rect x="235" y="440" width="330" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
  <text x="400" y="463" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#145B59" text-anchor="middle">COSM-WHT-01 • Cosmetic Dentistry</text>
</svg>
